<style>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem('jp'))||{}}catch(e){S={}}
S.done=S.done||{};S.sc=S.sc||{};S.w=S.w||{};S.hunt=S.hunt||[];S.gal=S.gal||[];S.wrong=S.wrong||[];

const J4=['Pendidikan','Politik','Propaganda','Iklan'];
const M=[
{id:1,ic:'🪐',t:'Kenali Konsep Teks Persuasi',b:'Concept Explorer',read:[
['Apa itu teks persuasi?','Persuasi berarti ajakan atau bujukan. Teks persuasi bertujuan meyakinkan atau mengajak pembaca agar meyakini, menyetujui, atau melakukan sesuatu, disertai alasan, fakta, atau bukti. INGAT: teks persuasi tidak sekadar mengajak, tetapi mengajak dengan alasan yang masuk akal. Tanpa alasan kuat, ajakan hanya menjadi perintah.'],
['Tujuan','1) Mengubah pandangan/sikap pembaca; 2) meyakinkan pembaca menyetujui pendapat penulis; 3) mendorong tindakan tertentu; 4) menawarkan solusi atas masalah.'],
['Fungsi','Sarana kampanye sosial, edukasi publik, penyampaian gagasan/opini secara terstruktur, dan membangun kesadaran kritis pembaca.'],
['Karakteristik','Berorientasi pada pembaca; argumentatif sekaligus persuasif; sikap penulis jelas; diakhiri ajakan, imbauan, atau penegasan eksplisit.'],
['Persuasi vs jenis teks lain','Persuasi: mengajak bersikap/bertindak, diakhiri ajakan eksplisit. Argumentasi: meyakinkan kebenaran pendapat, berhenti pada pembuktian. Eksposisi: menjelaskan informasi secara netral. Deskripsi: menggambarkan objek secara rinci.']],
qz:[['“Ayo jangan lupa membawa payung, cuaca hari ini mendung.” Persuasi atau bukan?',['Persuasi','Bukan Persuasi'],1,'Ada kata “ayo”, tetapi tidak ada isu, gagasan yang diperdebatkan, dan tujuan mengubah sikap. Hanya imbauan praktis sehari-hari. Kata ajakan saja tidak otomatis membuat teks persuasi.'],
['“Mari kurangi penggunaan plastik sekali pakai mulai hari ini, demi laut yang lebih bersih untuk anak cucu kita.”',['Persuasi','Bukan Persuasi'],0,'Ada isu (plastik), ajakan, dan alasan (laut bersih) yang mendorong perubahan tindakan.'],
['“Sampah plastik sulit terurai secara alami sehingga menjadi salah satu penyebab pencemaran laut.” Jenis teksnya…',['Persuasi','Argumentasi','Eksposisi','Deskripsi'],1,'Kalimat ini memberi alasan/pembuktian, tetapi tidak berujung pada ajakan bertindak: ciri argumentasi.'],
['“Plastik adalah material sintetis yang banyak digunakan dalam kemasan karena ringan dan murah.”',['Persuasi','Argumentasi','Eksposisi','Deskripsi'],2,'Bersifat netral dan informatif: eksposisi.']]},
{id:2,ic:'🔎',t:'Deteksi Ciri-Ciri',b:'Persuasion Detective',read:[['10 ciri teks persuasi yang baik','Sebuah teks tidak otomatis persuasi hanya karena ada kata ajakan. Sepuluh ciri: (1) bertujuan memengaruhi/mengajak; (2) isu atau permasalahan jelas; (3) gagasan/pendapat yang ingin diterima; (4) alasan atau argumen; (5) fakta/data sebagai penguat; (6) bahasa persuasif; (7) kata ajakan/imbauan; (8) mempertimbangkan kondisi dan kebutuhan pembaca; (9) bahasa logis dan efektif; (10) rekomendasi/ajakan tindakan yang jelas.']],
qz:[['DETECTIVE MODE — “Menurut saya, jam belajar malam perlu dikurangi demi kesehatan mental siswa.” Ciri yang muncul?',['Gagasan/pendapat yang ingin diterima','Fakta/data','Deskripsi indrawi','Kata ajakan'],0,'“Menurut saya” menandai posisi/pendirian penulis (ciri 3).'],
['“Membaca buku fisik membantu konsentrasi karena minim gangguan notifikasi.”',['Rekomendasi tindakan','Alasan/argumen','Isu','Bahasa berlebihan'],1,'Ada hubungan alasan (“karena…”) yang mendukung ajakan (ciri 4).'],
['“Mulai sekarang, bawalah botol minum sendiri dan kurangi kemasan plastik sekali pakai.”',['Rekomendasi/ajakan tindakan yang jelas','Fakta','Isu','Alasan'],0,'Ajakan konkret dan bisa langsung dilakukan (ciri 10).'],
['“Marilah kita jaga kebersihan lingkungan sekolah bersama-sama.”',['Data','Kata ajakan/imbauan','Opini ahli','Istilah teknis'],1,'“Marilah” adalah penanda eksplisit ajakan (ciri 7).']]},
{id:3,ic:'🛰️',t:'Bedah Struktur',b:'Structure Scanner',read:[['Tiga struktur','01 PENGENALAN ISU: memperkenalkan masalah/isu, latar belakang, konteks. 02 RANGKAIAN ARGUMEN: alasan, pendapat, fakta, data, atau bukti. 03 AJAKAN/PENEGASAN: ajakan eksplisit, simpulan, penegasan ulang pendapat.'],['Contoh: Penggunaan Media Sosial secara Bijak','Paragraf 1 memperkenalkan media sosial dan kekhawatiran dampaknya. Paragraf 2–4 (“Pertama… Kedua… Ketiga…”) memberi argumen. Paragraf akhir diawali “Oleh karena itu, marilah kita…”.']],
qz:[['SCAN THE TEXT — “Media sosial telah menjadi bagian tidak terpisahkan dari keseharian remaja masa kini… memunculkan kekhawatiran baru.”',['Pengenalan Isu','Rangkaian Argumen','Ajakan/Penegasan'],0,'Memperkenalkan topik dan latar isu.'],
['“Pertama, penggunaan media sosial yang berlebihan dapat menyita waktu yang seharusnya digunakan untuk belajar.”',['Pengenalan Isu','Rangkaian Argumen','Ajakan/Penegasan'],1,'Memberi alasan yang mendukung pendapat penulis.'],
['“Oleh karena itu, marilah kita mulai membiasakan diri menggunakan media sosial secara bijak.”',['Pengenalan Isu','Rangkaian Argumen','Ajakan/Penegasan'],2,'Ajakan eksplisit dengan konjungsi “oleh karena itu”.'],
['“Persoalan sebenarnya bukan pada media sosial itu sendiri, melainkan pada cara dan durasi penggunaannya.”',['Pengenalan Isu','Rangkaian Argumen','Ajakan/Penegasan'],1,'Penutup argumen yang menegaskan alasan, belum berupa ajakan.']]},
{id:4,ic:'🧪',t:'Lab Kaidah Kebahasaan',b:'Language Analyst',read:[['14 kaidah kebahasaan','Kata ajakan (mari, ayo, marilah) · Kata imbauan (hendaknya, sebaiknya, sepatutnya) · Kata kerja imperatif (jagalah, kurangilah) · Kata kerja mental (yakin, percaya, menduga, berpendapat) · Kata evaluatif (penting, berbahaya, bermanfaat, merugikan) · Konjungsi argumentatif (karena itu, dengan demikian, oleh sebab itu) · Konjungsi sebab-akibat (sebab, karena, akibatnya, sehingga) · Kata rujukan (hal ini, hal tersebut) · Istilah teknis (daur ulang, emisi karbon) · Fakta dan data · Kata rekomendasi (disarankan, dianjurkan, perlu dilakukan) · Kalimat efektif · Modalitas (harus, wajib, mungkin, seharusnya) · Ungkapan pembangun dorongan (“saatnya kita bertindak”, “tidak ada kata terlambat”).']],
qz:[['SORTING — “ayo”',['Kata ajakan','Kata imbauan','Modalitas','Kata evaluatif'],0,'Ayo/mari/marilah = kata ajakan.'],['“sebaiknya”',['Kata ajakan','Kata imbauan','Kata kerja mental','Istilah teknis'],1,'Menganjurkan tanpa kesan memaksa.'],['“jagalah”',['Kata kerja imperatif','Kata rujukan','Konjungsi','Kata evaluatif'],0,'Verba berakhiran -lah menyatakan perintah/permintaan.'],['“berpendapat”',['Kata kerja mental','Kata ajakan','Modalitas','Kata rekomendasi'],0,'Menyatakan sikap atau proses berpikir.'],['“berbahaya”',['Kata evaluatif','Kata imbauan','Fakta','Kata rujukan'],0,'Menilai baik/buruk untuk memengaruhi sikap.'],['“oleh sebab itu”',['Konjungsi sebab-akibat','Konjungsi argumentatif','Kata rujukan','Modalitas'],1,'Menghubungkan alasan dengan pendapat/simpulan.'],['“emisi karbon”',['Istilah teknis','Kata ajakan','Kata evaluatif','Modalitas'],0,'Memberi kesan kredibel sesuai topik.'],['“saatnya kita bertindak”',['Ungkapan pembangun dorongan','Kata rujukan','Kata kerja mental','Fakta'],0,'Membangkitkan urgensi bertindak.'],['“harus”',['Modalitas','Kata ajakan','Istilah teknis','Konjungsi'],0,'Menyatakan keharusan/kemungkinan/keinginan.']]},
{id:5,ic:'🕵️',t:'Investigasi Fakta, Opini, Argumen & Ajakan',b:'Evidence Hunter',read:[['Empat unsur','FAKTA: pernyataan objektif yang dapat diverifikasi. OPINI: pendapat/penilaian pribadi, subjektif dan dapat diperdebatkan. ARGUMEN: alasan yang mendukung pendapat, menghubungkan fakta/opini dengan simpulan. AJAKAN: dorongan agar pembaca bertindak, bersifat imperatif/persuasif.'],['Persuasi lemah vs kuat','Lemah: “Kita harus menjaga lingkungan karena lingkungan itu sangat penting.” (alasan hanya mengulang pendapat). Diperkuat dengan alasan jelas (air bersih, kesehatan warga) dan ajakan yang bisa langsung dilakukan.']],
qz:[['“Rata-rata siswa SMA menggunakan ponsel lebih dari empat jam sehari.”',['Fakta','Opini','Argumen','Ajakan'],0,'Bersifat data yang dapat diverifikasi.'],['“Menurut saya, penggunaan ponsel di sekolah sebaiknya dibatasi.”',['Fakta','Opini','Argumen','Ajakan'],1,'“Menurut saya” = penilaian pribadi.'],['“Karena mengganggu konsentrasi belajar, penggunaan ponsel saat pelajaran perlu diatur.”',['Fakta','Opini','Argumen','Ajakan'],2,'Ada alasan yang menghubungkan masalah dengan simpulan.'],['“Mari kita membatasi penggunaan ponsel di sekolah agar konsentrasi tetap terjaga.”',['Fakta','Opini','Argumen','Ajakan'],3,'Kata “mari” + dorongan bertindak.'],['BUKTI MANA YANG MEMPERKUAT PERSUASI? Argumen: “Sampah kemasan di sekolah menumpuk.”',['Cerita jajanan favorit penulis','Data jumlah sampah dari sekolah yang terverifikasi','Sejarah penemuan plastik','Rasa aneka jajanan'],1,'Bukti harus relevan dan dapat dipertanggungjawabkan.']]},
{id:6,ic:'🌍',t:'Klasifikasi Jenis Persuasi',b:'Type Classifier',read:[['Empat jenis','Persuasi Pendidikan (siswa, guru: rajin membaca, disiplin). Persuasi Politik (mengajak dalam hal politik; dibahas di sini secara deskriptif dan netral sebagai kategori teks, bukan dukungan pihak tertentu). Persuasi Propaganda (memengaruhi opini/sikap masyarakat: kampanye sosial, antinarkoba). Persuasi Iklan (calon konsumen: menggunakan atau membeli barang/jasa).']],
qz:[['CLASSIFY THE TRANSMISSION — “Mari biasakan membaca setidaknya 15 menit setiap hari.”',J4,0,'Bidang pendidikan, sasaran siswa.'],['“Mari gunakan hak pilih dengan bijak dan pilih berdasarkan informasi yang dapat dipercaya.”',J4,1,'Bidang politik (pemilihan umum); tetap netral, tidak menyebut pihak tertentu.'],['“Mari periksa sumber sebelum membagikan informasi.”',J4,2,'Kampanye sosial memengaruhi sikap masyarakat.'],['“Yuk, gunakan FreshBottle dan bawa minuman favoritmu ke mana saja!”',J4,3,'Mengajak calon konsumen memakai produk.']]},
{id:7,ic:'🔭',t:'Ruang Analisis',b:'Evidence Hunter',read:[['Teks: “Bijak Menggunakan Kecerdasan Buatan dalam Belajar”','P1: AI mengubah cara pelajar mengerjakan tugas; kemudahannya menggoda. P2: Risiko—terbiasa menerima jawaban instan; kemampuan analisis tidak berkembang; hasil AI tidak selalu akurat dan perlu verifikasi. P3: AI bermanfaat bila digunakan tepat; kuncinya AI sebagai alat bantu berpikir, bukan pengganti proses berpikir. P4: “Oleh karena itu, marilah kita gunakan kecerdasan buatan secara bijak…”'],['Tugas analisis','Identitas teks · struktur · fakta & opini · bahasa persuasif · sasaran, tujuan, ajakan utama · alasan dan bukti · strategi logos/ethos/pathos · bagian yang emosional/berlebihan · informasi yang perlu diverifikasi · evaluasi efektivitas (skala 1–4).']],
qz:[['EVIDENCE HUNT — Klik bukti: mana ajakan utama teks?',['“Kehadiran teknologi kecerdasan buatan (AI) telah mengubah banyak aspek kehidupan.”','“Hasil kerja AI tidak selalu akurat dan tetap memerlukan verifikasi.”','“Oleh karena itu, marilah kita gunakan kecerdasan buatan secara bijak dalam belajar.”'],2,'Ajakan eksplisit dengan kata “marilah”, di paragraf 4.'],
['Klik bukti: alasan yang mendukung ajakan (risiko).',['“Jika digunakan tanpa kendali, AI dapat membuat pelajar terbiasa menerima jawaban instan.”','“Kemudahan ini tentu menggoda.”','“Marilah kita gunakan…”'],0,' Ini alasan sebab-akibat yang mendukung ajakan.'],
['Klik bukti: informasi yang perlu diverifikasi.',['“Hasil kerja AI tidak selalu akurat.”','“Kuncinya terletak pada bagaimana pelajar memposisikan AI.”','“Kemudahan ini tentu menggoda.”'],0,'Klaim tentang akurasi AI sebaiknya diperiksa dengan sumber tepercaya.'],
['Strategi yang paling dominan?',['Logos (alasan dan risiko logis)','Pathos berlebihan','Ethos pakar','Tidak ada strategi'],0,'Teks bertumpu pada penjelasan risiko dan manfaat yang logis.']]}
];
const H=[
['Teks 1 (Jajan Kemasan)','Apa tujuan utama penulis Teks 1?',['Menjelaskan produksi kemasan plastik','Mengajak pelajar mengurangi sampah kemasan dengan membawa bekal sendiri','Menceritakan pengalaman di kantin','Membandingkan harga jajanan dan bekal','Menginformasikan jenis kemasan plastik'],1,'Teks diakhiri ajakan membawa bekal dan wadah sendiri demi lingkungan bersih: tujuan mengajak.'],
['Struktur','Bagian Teks 1 yang termasuk ajakan/penegasan?',['Paragraf 1','Paragraf 2','Paragraf 3','Paragraf 4','Tidak ada'],3,'Paragraf 4 diawali “Oleh karena itu, mari kita…”: ajakan eksplisit.'],
['Argumen','“Jika dikalikan dengan jumlah siswa… sampah menjadi sangat besar” berfungsi sebagai…',['Fakta statistik resmi','Ajakan langsung','Penalaran logis untuk memperkuat argumen','Kata imbauan','Penutup'],2,'Tidak ada angka resmi; ini penalaran logis (logos) berupa perkalian.'],
['Fakta vs opini','Kalimat Teks 1 yang tergolong OPINI?',['“Jajanan kemasan menjadi favorit banyak pelajar.”','“Sampah kemasan… menumpuk setiap hari.”','“Sebagian pelajar mungkin berpikir satu bungkus tidak berpengaruh.”','“Membawa bekal… dapat menjadi langkah sederhana.”','Semua fakta'],3,'“Langkah sederhana” adalah penilaian penulis. Pilihan lain dapat diamati/diverifikasi.'],
['Fakta/bukti','Bukti tambahan paling relevan untuk paragraf 2 Teks 1?',['Testimoni satu siswa','Data resmi sampah kemasan sekolah yang terverifikasi','Cerita jajanan masa kecil penulis','Deskripsi rasa jajanan','Sejarah plastik'],1,'Bukti kuat harus relevan dan dapat diverifikasi.'],
['Teks 2 (Budaya Antre)','Isu utama Teks 2?',['Menu kantin','Kedisiplinan antre pelajar','Jam operasional kantin','Persaingan harga','Kebersihan kantin'],1,'Teks membahas menyerobot antrean dan budaya antre.'],
['Argumen','“Sekolah bukan hanya tempat belajar… tetapi juga tempat melatih karakter” berfungsi untuk…',['Memberi data statistik','Memperluas makna pentingnya isu','Ajakan langsung','Menutup argumen tanpa penjelasan','Mengubah topik'],1,'Mengaitkan isu antre dengan tujuan lebih besar (karakter).'],

function quiz(box,qs,key,tags){let order=qs.map((_,i)=>i),i=0,sc=0,sel=-1,chk=false,wr=[];
 if(S.retry)order.sort(()=>Math.random()-.5);
 const draw=()=>{if(i>=order.length){const p=Math.round(sc/order.length*100);S.sc[key]=sc+'/'+order.length;if(key==='m9')S.wrong=wr;mark(key);save();
  box.innerHTML=`<div class="card"><span class="tag">Mission Report</span><h2>Skor: ${sc}/${order.length}</h2><p>Benar ${sc} · Salah ${order.length-sc} · ${p}%</p>${bar(p)}${wr.length?`<h3>Topik yang perlu dipelajari kembali</h3><p>${[...new Set(wr)].map(esc).join(' · ')}</p>`:'<p>🚀 Sempurna! Semua jawaban tepat.</p>'}<div class="row"><button id="rt">Ulangi Latihan</button><a class="btn g" href="#home">Ke Basecamp</a></div></div>`;
  $('#rt').onclick=()=>{S.retry=1;quiz(box,qs,key,tags)};return}
  const q=qs[order[i]];sel=-1;chk=false;
  box.innerHTML=`<div class="card"><div class="row"><span class="tag">Soal ${i+1}/${order.length}</span>${tags?`<span class="st">${esc(q[4])}</span>`:''}</div>${bar(i/order.length*100)}<h3>${esc(q[0])}</h3><div id="os">${q[1].map((o,k)=>`<button class="opt" data-k="${k}">${'ABCDE'[k]}. ${esc(o)}</button>`).join('')}</div><div id="fb"></div><div class="row"><button class="g" id="pv" ${i?'':'disabled'}>◀ Sebelumnya</button><button id="ck">Periksa Jawaban</button><button class="g" id="nx" disabled>Berikutnya ▶</button></div></div>`;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(chk)return;sel=+b.dataset.k;box.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b))});
  $('#ck').onclick=()=>{if(chk)return;if(sel<0){$('#fb').innerHTML='<div class="fb">Pilih satu jawaban dulu.</div>';return}chk=true;const ok=sel===q[2];if(ok)sc++;else wr.push(q[4]||'Konsep dasar');
   box.querySelectorAll('.opt').forEach((x,k)=>{if(k===q[2])x.classList.add('ok');else if(k===sel)x.classList.add('no')});
   $('#fb').innerHTML=`<div class="fb"><b>${ok?'✅ Tepat!':'❌ Belum tepat.'}</b> Jawaban: ${'ABCDE'[q[2]]}. ${esc(q[3])}</div>`;$('#nx').disabled=false;$('#nx').textContent=i+1>=order.length?'Lihat Hasil ▶':'Berikutnya ▶'};
  $('#nx').onclick=()=>{i++;draw()};$('#pv').onclick=()=>{}; $('#pv').disabled=true};
 S.retry=S.retry&&0;draw()}
